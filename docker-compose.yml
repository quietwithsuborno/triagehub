services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: triagehub
      POSTGRES_USER: triagehub
      POSTGRES_PASSWORD: triagehub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db

volumes:
  postgres_data: